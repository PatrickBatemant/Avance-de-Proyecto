<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2 id="welcomeMsg">Mis Tareas</h2>
        <button id="logoutBtn" class="btn-danger">Cerrar Sesión</button>
        
        <form id="taskForm">
            <input type="text" id="taskTitle" placeholder="Título de la tarea" required>
            <input type="text" id="taskDesc" placeholder="Descripción (opcional)">
            <button type="submit">Agregar Tarea</button>
        </form>
        
        <ul id="taskList"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
